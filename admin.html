<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070B16">
<title>Admin — Cyber Hat Live Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="chat.css">
</head>
<body class="adm">

<!-- Login -->
<div class="adm-login" id="login">
  <div class="adm-card">
    <h1>Admin login</h1>
    <p>Sign in to reply to website visitors.</p>
    <form id="login-form">
      <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="username"></div>
      <div class="field"><label for="pass">Password</label><input id="pass" type="password" required autocomplete="current-password"></div>
      <button class="submit-btn" type="submit">Sign in →</button>
      <div class="adm-err" id="login-err"></div>
    </form>
  </div>
</div>

<!-- App -->
<div class="adm-app" id="app" hidden>
  <aside class="adm-side">
    <div class="adm-top"><strong>Conversations</strong><button id="logout">Log out</button></div>
    <div class="adm-list" id="list"><div class="adm-empty">No conversations yet.</div></div>
  </aside>
  <main class="adm-main">
    <div class="adm-placeholder" id="placeholder">Select a conversation to start replying.</div>
    <div id="convo" hidden style="display:none; flex-direction:column; flex:1; min-height:0;">
      <div class="adm-bar">
        <button class="adm-back" id="back">←</button>
        <div class="info"><b id="c-name"></b><div id="c-meta"></div></div>
        <button id="del">Delete</button>
      </div>
      <div class="adm-brief" id="c-brief"></div>
      <div class="adm-msgs" id="msgs"></div>
      <form class="chat-send" id="reply-form">
        <textarea id="reply" placeholder="Type your reply…" rows="1"></textarea>
        <button type="submit">Send</button>
      </form>
    </div>
  </main>
</div>

<script type="module">
import { firebaseConfig, ADMIN_EMAIL } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, collection, query, orderBy, onSnapshot, getDocs, serverTimestamp, writeBatch, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = (id) => document.getElementById(id);
const loginErr = $('login-err');

if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('PASTE')) {
  loginErr.textContent = 'firebase-config.js is not filled in yet.';
  throw new Error('Firebase not configured');
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let chats = [];            // [{id, ...data}]
let selected = null;       // chat id
let unsubChats = null, unsubMsgs = null;
let firstLoad = true;
const BASE_TITLE = 'Admin — Cyber Hat Live Chat';

const fmtTime = (ts) => {
  if (!ts || !ts.toDate) return '';
  const d = ts.toDate(), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString([], { day: 'numeric', month: 'short' });
};

function beep() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.08;
    o.connect(g); g.connect(c.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.35);
    o.stop(c.currentTime + 0.36);
  } catch (e) {}
}

// ---------- Login ----------
$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  loginErr.textContent = '';
  try {
    await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value);
  } catch (err) {
    loginErr.textContent = 'Login failed: ' + (err.code || err.message);
  }
});
$('logout').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  const isAdmin = user && !user.isAnonymous && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
  if (user && !isAdmin && !user.isAnonymous) {
    loginErr.textContent = 'This account is not an admin.';
    signOut(auth); return;
  }
  if (!isAdmin) {
    // visitors' anonymous session (same browser) must not count as admin
    $('login').hidden = false; $('app').hidden = true;
    if (unsubChats) { unsubChats(); unsubChats = null; }
    if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
    return;
  }
  $('login').hidden = true; $('app').hidden = false;
  listenChats();
});

// ---------- Conversation list ----------
function listenChats() {
  if (unsubChats) return;
  firstLoad = true;
  const q = query(collection(db, 'chats'), orderBy('lastMessageAt', 'desc'));
  unsubChats = onSnapshot(q, (snap) => {
    if (!firstLoad) {
      snap.docChanges().forEach(ch => {
        const d = ch.doc.data();
        if (ch.type !== 'removed' && d.unreadAdmin && ch.doc.id !== selected && !ch.doc.metadata.hasPendingWrites) beep();
      });
    }
    firstLoad = false;
    chats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderList();
    const unread = chats.filter(c => c.unreadAdmin && c.id !== selected).length;
    document.title = unread ? `(${unread}) New message — Cyber Hat` : BASE_TITLE;
    // keep the open conversation's unread flag cleared
    const cur = chats.find(c => c.id === selected);
    if (cur && cur.unreadAdmin) updateDoc(doc(db, 'chats', cur.id), { unreadAdmin: false }).catch(() => {});
  }, (err) => {
    $('list').innerHTML = '<div class="adm-empty">Access denied. Check firestore.rules and the admin email.</div>';
    console.error(err);
  });
}

function renderList() {
  const list = $('list');
  list.innerHTML = '';
  if (!chats.length) { list.innerHTML = '<div class="adm-empty">No conversations yet.</div>'; return; }
  chats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'adm-item' + (c.id === selected ? ' active' : '') + (c.unreadAdmin && c.id !== selected ? ' unread' : '');
    const r1 = document.createElement('div'); r1.className = 'row1';
    const n = document.createElement('b'); n.textContent = c.name || 'Visitor';
    const t = document.createElement('time'); t.textContent = fmtTime(c.lastMessageAt);
    r1.append(n, t);
    const o = document.createElement('div'); o.className = 'org'; o.textContent = [c.org, c.need].filter(Boolean).join(' · ');
    const l = document.createElement('div'); l.className = 'last'; l.textContent = c.lastMessage || '';
    b.append(r1, o, l);
    b.addEventListener('click', () => openConvo(c.id));
    list.appendChild(b);
  });
}

// ---------- Open a conversation ----------
function openConvo(id) {
  selected = id;
  const c = chats.find(x => x.id === id);
  if (!c) return;
  $('placeholder').style.display = 'none';
  const convo = $('convo'); convo.hidden = false; convo.style.display = 'flex';
  $('app').classList.add('open');
  $('c-name').textContent = c.name;
  const meta = $('c-meta'); meta.innerHTML = '';
  const bits = [c.org, c.need];
  meta.append(document.createTextNode(bits.filter(Boolean).join(' · ')));
  if (c.phone) {
    const digits = c.phone.replace(/[^\d]/g, '');
    meta.append(document.createTextNode(' · '));
    const a = document.createElement('a'); a.href = 'tel:' + c.phone; a.textContent = c.phone;
    meta.append(a);
    if (digits) {
      meta.append(document.createTextNode(' · '));
      const w = document.createElement('a'); w.href = 'https://wa.me/' + digits; w.target = '_blank'; w.rel = 'noopener'; w.textContent = 'WhatsApp';
      meta.append(w);
    }
  }
  $('c-brief').innerHTML = '';
  const bb = document.createElement('b'); bb.textContent = 'First brief: ';
  $('c-brief').append(bb, document.createTextNode(c.brief || ''));

  if (c.unreadAdmin) updateDoc(doc(db, 'chats', id), { unreadAdmin: false }).catch(() => {});
  renderList();

  if (unsubMsgs) unsubMsgs();
  const q = query(collection(db, 'chats', id, 'messages'), orderBy('createdAt'));
  unsubMsgs = onSnapshot(q, (snap) => {
    const box = $('msgs'); box.innerHTML = '';
    snap.forEach(d => {
      const m = d.data();
      const b = document.createElement('div');
      b.className = 'bubble ' + (m.from === 'admin' ? 'me' : 'them');
      const s = document.createElement('span'); s.textContent = m.text;
      const t = document.createElement('time');
      t.textContent = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate().toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      b.append(s, t); box.appendChild(b);
    });
    box.scrollTop = box.scrollHeight;
  });
  $('reply').focus();
}

$('back').addEventListener('click', () => {
  $('app').classList.remove('open'); selected = null; renderList();
});

// ---------- Reply ----------
$('reply-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('reply').value.trim();
  if (!text || !selected) return;
  $('reply').value = '';
  try {
    const batch = writeBatch(db);
    batch.set(doc(collection(db, 'chats', selected, 'messages')), { text: text.slice(0, 2000), from: 'admin', createdAt: serverTimestamp() });
    batch.update(doc(db, 'chats', selected), { lastMessage: 'You: ' + text.slice(0, 110), lastMessageAt: serverTimestamp(), unreadAdmin: false });
    await batch.commit();
  } catch (err) {
    console.error(err); $('reply').value = text; alert('Send failed: ' + err.message);
  }
});
$('reply').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('reply-form').requestSubmit(); }
});

// ---------- Delete conversation ----------
$('del').addEventListener('click', async () => {
  if (!selected || !confirm('Delete this whole conversation? This cannot be undone.')) return;
  const id = selected;
  try {
    const msgs = await getDocs(collection(db, 'chats', id, 'messages'));
    const batch = writeBatch(db);
    msgs.forEach(m => batch.delete(m.ref));
    batch.delete(doc(db, 'chats', id));
    await batch.commit();
    if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
    selected = null;
    $('convo').style.display = 'none'; $('placeholder').style.display = '';
    $('app').classList.remove('open');
  } catch (err) { alert('Delete failed: ' + err.message); }
});
</script>
</body>
</html>
